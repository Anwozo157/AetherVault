name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: node scripts/check-bundle-size.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  backend:
    name: Database rules + signed-in console (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Local Supabase in Docker on the runner (free); same config as development.
      - run: npx supabase start
      - name: Database rule tests (pgTAP)
        run: npx supabase test db
      - run: npx playwright install --with-deps chromium
      - name: Two-browser console tests
        run: npm run e2e:console
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: console-playwright-report
          path: playwright-report
          retention-days: 7
      - if: always()
        run: npx supabase stop --no-backup

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan every commit for leaked credentials
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner

  terraform:
    name: Infrastructure as code (fmt, validate, scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.7
      - name: Formatting
        run: terraform fmt -check -recursive infra collector/terraform
      # No cloud credentials in CI: init without a backend, validate the configuration only.
      - name: Validate every Terraform folder
        run: |
          for dir in collector/terraform infra/accounts/azure infra/poc/azure; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: Security scan (Checkov, report only for now)
        run: |
          pip install --quiet checkov==3.2.*
          checkov --directory infra --directory collector/terraform --framework terraform --compact --quiet --soft-fail
